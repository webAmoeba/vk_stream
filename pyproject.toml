[project]
name = "vk-stream"
version = "0.1.0"
description = "24/7 VK RTMP streamer for MKV playlists"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
vk-stream = "vk_stream.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
