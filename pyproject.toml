[project]
name = "vk-stream"
version = "0.2.0"
description = "OBS-based VK streamer (VLC source with burned subtitles)"
requires-python = ">=3.10"
dependencies = [
  "obsws-python>=1.6.0",
]

[project.scripts]
vk-stream = "vk_stream.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
